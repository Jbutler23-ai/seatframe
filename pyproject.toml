[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "seatframe"
version = "0.1.0"
description = "A small fictional game and concert seat-view geometry prototype"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
seatframe = "seatframe.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["seatframe*"]
